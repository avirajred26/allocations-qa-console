name: QA run
run-name: "QA run ${{ inputs.run_ref || 'scheduled' }}"

on:
  # Light, read-only health signal so the console's run history reflects reality between demos.
  # Same pre-auth checks as a manual run; 4 runs/day against the public sign-in page.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_ref:
        description: Correlation ref generated by the QA console (opaque, 8–32 chars)
        required: true
        type: string
      target:
        description: Target environment label (informational; harness only hits public prod surface)
        required: false
        default: prod-public
        type: choice
        options: [prod-public]
      suite:
        description: Which project(s) to run
        required: false
        default: all
        type: choice
        options: [all, desktop, mobile]

# One run at a time per ref; never cancel a run a reviewer may be watching.
concurrency:
  group: qa-run-${{ inputs.run_ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preauth-smoke:
    name: Pre-auth smoke (${{ inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://dashboard.allocations.com
      CI: "true"
      RUN_REF: ${{ inputs.run_ref || format('sched-{0}', github.run_id) }}
      TARGET: ${{ inputs.target || 'prod-public' }}
      SUITE: ${{ inputs.suite || 'all' }}
    steps:
      - name: Validate run_ref shape
        run: |
          if ! [[ "$RUN_REF" =~ ^[A-Za-z0-9_-]{8,32}$ ]]; then
            echo "::error::run_ref must be 8–32 chars of [A-Za-z0-9_-]"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright
        id: pw
        continue-on-error: true
        run: |
          case "$SUITE" in
            desktop) PROJ="--project=desktop-chromium" ;;
            mobile)  PROJ="--project=mobile-iphone" ;;
            *)       PROJ="" ;;
          esac
          npx playwright test $PROJ

      - name: Upload HTML report + traces (retain-on-failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.RUN_REF }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Write machine-readable summary
        if: always()
        run: |
          if [ -f test-results/results.json ]; then
            node -e '
              const r=require("./test-results/results.json");
              require("fs").writeFileSync("qa-summary.json", JSON.stringify({run_ref:process.env.RUN_REF, suite:process.env.SUITE, stats:r.stats}));
            '
          fi

      # Tiny artifact the console reads for run history, so it never has to download traces.
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-summary-${{ env.RUN_REF }}
          path: qa-summary.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## QA run \`$RUN_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | $TARGET |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | $SUITE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Playwright outcome | ${{ steps.pw.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/results.json ]; then
            node -e '
              const r=require("./test-results/results.json");
              const s=r.stats||{};
              console.log(`| Passed | ${s.expected??"?"} |`);
              console.log(`| Failed | ${s.unexpected??"?"} |`);
              console.log(`| Flaky | ${s.flaky??"?"} |`);
              console.log(`| Skipped | ${s.skipped??"?"} |`);
              console.log(`| Duration | ${Math.round((s.duration??0)/1000)}s |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Propagate test outcome
        if: steps.pw.outcome == 'failure'
        run: exit 1
