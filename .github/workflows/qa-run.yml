name: QA run
run-name: "QA run ${{ inputs.run_ref || 'scheduled' }}"

on:
  # Light, read-only health signal so the console's run history reflects reality between demos.
  # Same pre-auth checks as a manual run; 4 runs/day against the public sign-in page.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_ref:
        description: Correlation ref generated by the QA console (opaque, 8–32 chars)
        required: true
        type: string
      target:
        description: Target environment label (informational; harness only hits public prod surface)
        required: false
        default: prod-public
        type: choice
        options: [prod-public]
      suite:
        description: Which project(s) to run
        required: false
        default: all
        type: choice
        options: [all, desktop, mobile, drill]

# One run at a time per ref; never cancel a run a reviewer may be watching.
concurrency:
  group: qa-run-${{ inputs.run_ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preauth-smoke:
    name: Pre-auth smoke (${{ inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://dashboard.allocations.com
      CI: "true"
      RUN_REF: ${{ inputs.run_ref || format('sched-{0}', github.run_id) }}
      TARGET: ${{ inputs.target || 'prod-public' }}
      SUITE: ${{ inputs.suite || 'all' }}
    steps:
      - name: Validate run_ref shape
        run: |
          if ! [[ "$RUN_REF" =~ ^[A-Za-z0-9_-]{8,32}$ ]]; then
            echo "::error::run_ref must be 8–32 chars of [A-Za-z0-9_-]"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright
        id: pw
        continue-on-error: true
        run: |
          case "$SUITE" in
            desktop) PROJ="--project=desktop-chromium" ;;
            mobile)  PROJ="--project=mobile-iphone" ;;
            # Deliberate, read-only failures that prove the failure-reporting path.
            drill)   PROJ="--project=desktop-chromium"; export QA_DRILL=1 ;;
            *)       PROJ="" ;;
          esac
          npx playwright test $PROJ

      - name: Upload HTML report + traces (retain-on-failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.RUN_REF }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Report (job summary, Slack/Teams if configured)
        if: always()
        env:
          QA_PHASE: ${{ github.event_name == 'schedule' && 'health' || (env.SUITE == 'drill' && 'drill' || 'manual') }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CONSOLE_URL: ${{ vars.QA_CONSOLE_URL }}
          PR_AUTHOR: ${{ github.actor }}
        run: node scripts/qa-notify.mjs

      # Tiny artifact the console reads for run history and the run report page.
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-summary-${{ env.RUN_REF }}
          path: qa-summary.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Propagate test outcome
        if: steps.pw.outcome == 'failure'
        run: exit 1
